# Databricks Apps manifest.
#
# Apps runs the command below inside a managed container and routes traffic to
# $DATABRICKS_APP_PORT. Secrets arrive as environment variables from the same
# `pockettaste` scope the batch jobs use, so nothing is duplicated.
command:
  - uvicorn
  - app.main:app
  - --host
  - 0.0.0.0
  - --port
  - $DATABRICKS_APP_PORT

# `valueFrom` reads a key from the `pockettaste` secret scope. The app's own service
# principal needs READ on that scope or every one of these resolves to nothing and
# the container boots with no configuration. The deploy script grants it.
env:
  - name: DB_URL
    valueFrom: mongo_uri
  - name: OPENAI_KEY
    valueFrom: openai_key
  - name: JWT_SECRET
    valueFrom: jwt_secret
  - name: SARVAM_API_KEY
    valueFrom: sarvam_api_key
  - name: DATABRICKS_TOKEN
    valueFrom: databricks_token
  - name: MONGO_DB_NAME
    value: Click
  - name: STORIES_COLLECTION
    value: stories
  - name: SARVAM_LANGUAGES
    value: hi,ta,te,bn,mr,kn,gu
  - name: ENVIRONMENT
    value: production
  # The API is one container, so the loop would run once per replica. Keep the
  # scheduled work in the Databricks job, which has exactly one owner.
  - name: BACKGROUND_PIPELINE_ENABLED
    value: "false"
